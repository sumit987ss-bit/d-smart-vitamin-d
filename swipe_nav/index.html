<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
html, body { margin:0; padding:0; font-family: system-ui, sans-serif; background: transparent; }
#swipe-zone {
  box-sizing: border-box; width:100%; height:58px; border:1px solid #b8ded5;
  border-radius:14px; background:linear-gradient(90deg,#e0f7f1,#edf4ff);
  color:#087f8c; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; user-select:none; -webkit-user-select:none;
  touch-action: pan-y;
}
</style>
</head>
<body>
<div id="swipe-zone" role="button" aria-label="Swipe left or right to change screen">
  ⇠ Swipe left / right to change screen ⇢
</div>
<script>
(function () {
  const zone = document.getElementById("swipe-zone");
  let startX = null, startY = null;
  function send(direction) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: { direction: direction, seq: Date.now() },
      dataType: "json"
    }, "*");
  }
  zone.addEventListener("touchstart", function (e) {
    if (!e.touches || e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, {passive:true});
  zone.addEventListener("touchend", function (e) {
    if (startX === null || !e.changedTouches || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      send(dx < 0 ? "left" : "right");
    }
    startX = null; startY = null;
  }, {passive:true});
  zone.addEventListener("pointerdown", function(e) {
    if (e.pointerType === "mouse") { startX = e.clientX; startY = e.clientY; }
  });
  zone.addEventListener("pointerup", function(e) {
    if (e.pointerType !== "mouse" || startX === null) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      send(dx < 0 ? "left" : "right");
    }
    startX = null; startY = null;
  });
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:62}, "*");
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1}, "*");
})();
</script>
</body>
</html>
