<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087f8c">
  <meta name="description" content="SEHAT SAATHI — bilingual health, hygiene and sanitation learning for healthier communities.">
  <meta name="application-name" content="SEHAT SAATHI">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SEHAT SAATHI">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>SEHAT SAATHI | ਸਿਹਤ ਸਾਥੀ</title>
  <style>
    :root{color-scheme:light;--teal:#087f8c;--green:#16a085;--ink:#173d46;--muted:#557078}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eaf7ff;color:var(--ink)}
    body{display:flex;flex-direction:column;min-height:100dvh}
    .topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 15px 10px;background:linear-gradient(110deg,#087f8c,#16a085);color:white;box-shadow:0 3px 14px #064e3b25;z-index:2}
    .brand-icon{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:#ffffff20;border:1px solid #ffffff55;display:grid;place-items:center}
    .brand-icon img{width:38px;height:38px}
    .brand-copy{min-width:0;flex:1}
    .brand-name{font-size:18px;font-weight:850;letter-spacing:.5px;line-height:1.15}
    .brand-punjabi{font-size:13px;font-weight:650;opacity:.96;margin-top:3px}
    .status{font-size:11px;font-weight:750;border:1px solid #ffffff70;border-radius:999px;padding:5px 8px;white-space:nowrap}
    .frame-wrap{flex:1;min-height:0;position:relative;background:linear-gradient(180deg,#eaf7ff,#f0fff4)}
    iframe{display:block;border:0;width:100%;height:100%;min-height:calc(100dvh - 66px);background:transparent}
    .offline{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:10px 14px;border-radius:12px;background:#7c2d12;color:white;font-size:13px;font-weight:650;z-index:5;box-shadow:0 5px 20px #0002}
    .offline.show{display:block}
    @media(min-width:900px){.topbar{padding-left:24px;padding-right:24px}.brand-name{font-size:20px}.frame-wrap{max-width:1100px;width:100%;margin:0 auto;flex:1}.frame-wrap iframe{min-height:calc(100dvh - 66px)}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-icon"><img src="./icon.svg" alt=""></div>
    <div class="brand-copy">
      <div class="brand-name">SEHAT SAATHI</div>
      <div class="brand-punjabi">ਸਿਹਤ ਸਾਥੀ · Health • Hygiene • Sanitation</div>
    </div>
    <div class="status" id="connectionStatus">ONLINE</div>
  </header>
  <main class="frame-wrap" aria-label="SEHAT SAATHI learning app">
    <iframe
      src="https://d-smart-vitamin-d-e6dzxawuusg9dlujaypxdt.streamlit.app/?embed=true"
      title="SEHAT SAATHI health learning app"
      allow="clipboard-read; clipboard-write"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>
  <div class="offline" id="offlineNotice" role="status">You are offline. SEHAT SAATHI needs an internet connection for learning activities and the AI Mentor.</div>
  <script>
    const statusEl=document.getElementById('connectionStatus');
    const offlineEl=document.getElementById('offlineNotice');
    function updateConnection(){
      const online=navigator.onLine;
      statusEl.textContent=online?'ONLINE':'OFFLINE';
      statusEl.style.background=online?'#ffffff20':'#7c2d12';
      offlineEl.classList.toggle('show',!online);
    }
    addEventListener('online',updateConnection);
    addEventListener('offline',updateConnection);
    updateConnection();
    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
